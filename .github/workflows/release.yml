name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  RUST_TOOLCHAIN: stable

jobs:
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.prerelease.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Capture release tag metadata
        id: meta
        shell: bash
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate configured versions against tag
        shell: bash
        run: node scripts/validate-release-config-version.mjs "${GITHUB_REF}"

      - name: Detect prerelease from tag
        id: prerelease
        shell: bash
        run: node scripts/detect-release-prerelease.mjs "${GITHUB_REF}" >> "$GITHUB_OUTPUT"

  build_windows_nsis:
    name: Build Windows installer
    needs: guardrails
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      - name: Install app dependencies
        shell: bash
        working-directory: app
        run: npm ci

      # electron-builder takes its version from app/package.json. NSIS rejects a
      # semver prerelease suffix in the installer's version fields, so strip it
      # for the build; the release itself is still published under the full tag.
      - name: Normalize installer version for prerelease tags
        shell: bash
        run: |
          tag="${{ needs.guardrails.outputs.tag }}"
          version="${tag#v}"
          base_version="${version%%-*}"

          if [ "$version" != "$base_version" ]; then
            node -e "const fs=require('fs'); const p='app/package.json'; const d=JSON.parse(fs.readFileSync(p,'utf8')); d.version='${base_version}'; fs.writeFileSync(p, JSON.stringify(d, null, 2)+'\n');"
          fi

      - name: Build Rust sidecar binaries
        shell: bash
        working-directory: app
        run: npm run build:rust

      - name: Build renderer and main bundles
        shell: bash
        working-directory: app
        run: npm run build

      - name: Build Windows NSIS installer
        shell: bash
        working-directory: app
        run: npx electron-builder --win nsis

      - name: Capture installer output path
        id: capture_exe
        shell: bash
        working-directory: app
        run: |
          mapfile -t exe_files < <(find dist -maxdepth 1 -type f -name "*.exe" | sort)
          if [ "${#exe_files[@]}" -ne 1 ]; then
            echo "Expected exactly one .exe in app/dist, found ${#exe_files[@]}" >&2
            printf ' - %s\n' "${exe_files[@]}" >&2
            exit 1
          fi
          echo "exe_output_path=app/${exe_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-raw
          path: ${{ steps.capture_exe.outputs.exe_output_path }}
          if-no-files-found: error

  build_linux:
    name: Build Linux packages
    needs: guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ env.RUST_TOOLCHAIN }}-

      # electron-builder shells out to dpkg for deb and needs fakeroot for both
      # deb and pacman. No GTK/WebKit dev packages: Electron ships its own
      # Chromium, which is the whole reason the Tauri build was replaced.
      - name: Install packaging dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y fakeroot dpkg

      - name: Install app dependencies
        shell: bash
        working-directory: app
        run: npm ci

      - name: Build Rust sidecar binaries
        shell: bash
        working-directory: app
        run: npm run build:rust

      - name: Build renderer and main bundles
        shell: bash
        working-directory: app
        run: npm run build

      # deb and pacman only. AppImage is a supported local target but is not
      # part of the published asset set.
      - name: Build Linux packages
        shell: bash
        working-directory: app
        run: npx electron-builder --linux deb pacman

      - name: Capture Linux package output paths
        id: capture_linux
        shell: bash
        working-directory: app
        run: |
          for spec in "deb:*.deb" "pacman:*.pacman"; do
            label="${spec%%:*}"
            pattern="${spec#*:}"
            mapfile -t files < <(find dist -maxdepth 1 -type f -name "$pattern" | sort)
            if [ "${#files[@]}" -ne 1 ]; then
              echo "Expected exactly one $label artifact in app/dist, found ${#files[@]}" >&2
              printf ' - %s\n' "${files[@]}" >&2
              exit 1
            fi
            echo "${label}_output_path=app/${files[0]}" >> "$GITHUB_OUTPUT"
          done

      - name: Upload Linux Debian artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-raw
          path: ${{ steps.capture_linux.outputs.deb_output_path }}
          if-no-files-found: error

      - name: Upload Linux Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arch-pkg-tar-zst-raw
          path: ${{ steps.capture_linux.outputs.pacman_output_path }}
          if-no-files-found: error

  publish_fan_in:
    name: Publish raw artifact fan-in
    needs: [guardrails, build_windows_nsis, build_linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download raw Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-raw
          path: dist/raw/windows-nsis-raw

      - name: Download raw Linux Debian artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-deb-raw
          path: dist/raw/linux-deb-raw

      - name: Download raw Linux Arch package artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-arch-pkg-tar-zst-raw
          path: dist/raw/linux-arch-pkg-tar-zst-raw

      - name: Upload publish fan-in raw artifact set
        uses: actions/upload-artifact@v4
        with:
          name: publish-raw-assets-fan-in
          path: dist/raw
          if-no-files-found: error

  publish_prepare:
    name: Publish asset preparation
    needs: [guardrails, publish_fan_in]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Download publish fan-in raw artifact set
        uses: actions/download-artifact@v4
        with:
          name: publish-raw-assets-fan-in
          path: dist/raw

      - name: Normalize publish asset filenames and generate SHA256SUMS
        shell: bash
        run: node scripts/normalize-release-assets.mjs --tag "${{ needs.guardrails.outputs.tag }}" --input-dir dist/raw --output-dir dist/publish

      - name: Upload normalized publish assets
        uses: actions/upload-artifact@v4
        with:
          name: publish-assets-normalized
          path: dist/publish
          if-no-files-found: error

  publish:
    name: Publish GitHub release assets
    needs: [guardrails, publish_prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download normalized publish assets
        uses: actions/download-artifact@v4
        with:
          name: publish-assets-normalized
          path: dist/publish

      - name: Assert required publish assets are present
        shell: bash
        run: |
          set -euo pipefail

          count_pattern() {
            local pattern="$1"
            local count
            count=$(compgen -G "$pattern" | wc -l | tr -d ' ')
            echo "$count"
          }

          exe_count=$(count_pattern "dist/publish/*.exe")
          deb_count=$(count_pattern "dist/publish/*.deb")
          arch_count=$(count_pattern "dist/publish/*.pkg.tar.zst")

          if [ "$exe_count" -ne 1 ]; then
            echo "Expected exactly one Windows installer in dist/publish, found $exe_count" >&2
            exit 1
          fi

          if [ "$deb_count" -ne 1 ]; then
            echo "Expected exactly one Debian package in dist/publish, found $deb_count" >&2
            exit 1
          fi

          if [ "$arch_count" -ne 1 ]; then
            echo "Expected exactly one Arch package in dist/publish, found $arch_count" >&2
            exit 1
          fi

          if [ ! -f "dist/publish/SHA256SUMS" ]; then
            echo "Missing SHA256SUMS in dist/publish" >&2
            exit 1
          fi

      - name: Assert publish asset set is deterministic
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t asset_files < <(find dist/publish -maxdepth 1 -type f -printf "%f\n" | sort)
          expected_assets=(
            "SHA256SUMS"
          )

          mapfile -t exe_assets < <(find dist/publish -maxdepth 1 -type f -name "*.exe" -printf "%f\n" | sort)
          mapfile -t deb_assets < <(find dist/publish -maxdepth 1 -type f -name "*.deb" -printf "%f\n" | sort)
          mapfile -t arch_assets < <(find dist/publish -maxdepth 1 -type f -name "*.pkg.tar.zst" -printf "%f\n" | sort)

          expected_assets+=("${exe_assets[@]}" "${deb_assets[@]}" "${arch_assets[@]}")
          mapfile -t expected_assets < <(printf "%s\n" "${expected_assets[@]}" | sort)

          if [ "${#expected_assets[@]}" -ne 4 ]; then
            echo "Expected exactly 4 publish assets (SHA256SUMS and one package per platform), found ${#expected_assets[@]}" >&2
            printf ' - %s\n' "${expected_assets[@]}" >&2
            exit 1
          fi

          if [ "${#asset_files[@]}" -ne "${#expected_assets[@]}" ]; then
            echo "Publish directory has unexpected extra/missing files" >&2
            printf 'Expected:\n' >&2
            printf ' - %s\n' "${expected_assets[@]}" >&2
            printf 'Actual:\n' >&2
            printf ' - %s\n' "${asset_files[@]}" >&2
            exit 1
          fi

          for i in "${!expected_assets[@]}"; do
            if [ "${expected_assets[$i]}" != "${asset_files[$i]}" ]; then
              echo "Publish directory mismatch at index $i: expected ${expected_assets[$i]}, got ${asset_files[$i]}" >&2
              exit 1
            fi
          done

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.guardrails.outputs.tag }}"
          prerelease="${{ needs.guardrails.outputs.prerelease }}"
          repo="${GITHUB_REPOSITORY}"

          if gh api "/repos/${repo}/releases/tags/${tag}" >/dev/null 2>&1; then
            release_id=$(gh api "/repos/${repo}/releases/tags/${tag}" --jq ".id")
            gh api --method PATCH "/repos/${repo}/releases/${release_id}" \
              -f tag_name="${tag}" \
              -f name="${tag}" \
              -F prerelease="${prerelease}" \
              >/dev/null
          else
            gh api --method POST "/repos/${repo}/releases" \
              -f tag_name="${tag}" \
              -f name="${tag}" \
              -F prerelease="${prerelease}" \
                -F generate_release_notes=true \
                >/dev/null
          fi

      - name: Remove unmanaged existing release assets before upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.guardrails.outputs.tag }}"
          repo="${GITHUB_REPOSITORY}"

          mapfile -t expected_names < <(find dist/publish -maxdepth 1 -type f -printf "%f\n" | sort)

          while IFS=$'\t' read -r asset_name asset_id; do
            keep_asset=false
            for expected_name in "${expected_names[@]}"; do
              if [ "$asset_name" = "$expected_name" ]; then
                keep_asset=true
                break
              fi
            done

            if [ "$keep_asset" = false ]; then
              echo "Deleting unmanaged existing release asset: $asset_name"
              gh api --method DELETE "/repos/${repo}/releases/assets/${asset_id}" >/dev/null
            fi
          done < <(gh api "/repos/${repo}/releases/tags/${tag}" --jq '.assets[] | [.name, (.id|tostring)] | @tsv')

      - name: Upload release assets with overwrite semantics
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.guardrails.outputs.tag }}"
          gh release upload "${tag}" dist/publish/* --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Assert release assets exactly match normalized publish set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.guardrails.outputs.tag }}"
          repo="${GITHUB_REPOSITORY}"

          mapfile -t expected_names < <(find dist/publish -maxdepth 1 -type f -printf "%f\n" | sort)
          mapfile -t release_names < <(gh api "/repos/${repo}/releases/tags/${tag}" --jq '.assets[].name' | sort)

          if [ "${#expected_names[@]}" -ne "${#release_names[@]}" ]; then
            echo "Release asset count mismatch for ${tag}: expected ${#expected_names[@]}, found ${#release_names[@]}" >&2
            printf 'Expected:\n' >&2
            printf ' - %s\n' "${expected_names[@]}" >&2
            printf 'Actual:\n' >&2
            printf ' - %s\n' "${release_names[@]}" >&2
            exit 1
          fi

          for i in "${!expected_names[@]}"; do
            if [ "${expected_names[$i]}" != "${release_names[$i]}" ]; then
              echo "Release asset mismatch at index $i: expected ${expected_names[$i]}, got ${release_names[$i]}" >&2
              exit 1
            fi
          done
