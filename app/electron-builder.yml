appId: com.kitsune.dm
productName: Kitsune Download Manager
copyright: Copyright © 2026 Oliver Marcusson
directories:
  output: dist
  buildResources: resources

files:
  - out/**
  - package.json

# extraResources is declared per-platform, never at the top level: a
# platform-specific list is MERGED with the top-level one rather than replacing
# it, which shipped the Linux ELF binaries and shell scripts inside the Windows
# installer.
#
# The Rust engine rides along as a sidecar binary; Sidecar.resolveBinary() looks
# for it directly in resourcesPath. The native-messaging pieces ship beside it so
# the install hooks can generate a manifest pointing at the real shim path.

linux:
  syncDesktopName: true
  extraResources:
    - from: ../target/release/kitsune-daemon
      to: kitsune-daemon
    - from: ../target/release/kitsune-shim
      to: kitsune-shim
    - from: ../target/release/native-host-manifest
      to: native-host-manifest
    - from: ../scripts/linux/self-heal-native-host.sh
      to: self-heal-native-host
    - from: ../scripts/linux/native-host-status.sh
      to: native-host-status
    - from: ../extension/extension_id_source.txt
      to: extension_id_source.txt
    - from: resources/icon.png
      to: icon.png
  target:
    - deb
    - pacman
    - AppImage
  category: Network
  icon: resources/icons
  # Pinned rather than left to derive from package.json: the desktop entry's
  # StartupWMClass and build/linux-after-upgrade.sh both hardcode this value.
  executableName: kitsune-dm
  synopsis: The blazingly fast IDM alternative
  description: >-
    Kitsune is a cross-platform download manager focused on native performance
    and seamless browser integration, pairing a Rust download engine with an
    Electron desktop app.
  desktop:
    entry:
      Name: Kitsune Download Manager
      GenericName: Download Manager
      Categories: Network;FileTransfer;
      Keywords: download;manager;idm;kitsune;
      MimeType: x-scheme-handler/kitsune;
      StartupWMClass: kitsune-dm

deb:
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0

pacman:
  afterInstall: build/linux-after-install.sh
  afterRemove: build/linux-after-remove.sh
  # electron-builder emits no post_upgrade, but that is the function pacman runs
  # when replacing an installed package, so pass one to fpm directly.
  fpm:
    - --after-upgrade
    - build/linux-after-upgrade.sh

win:
  target:
    - nsis
  icon: resources/icon.png
  # Windows needs .exe binaries; the self-heal / status shell scripts are
  # Linux-only. Built natively on a Windows runner, so this is target/release
  # rather than a cross-compile triple.
  extraResources:
    - from: ../target/release/kitsune-daemon.exe
      to: kitsune-daemon.exe
    - from: ../target/release/kitsune-shim.exe
      to: kitsune-shim.exe
    - from: ../target/release/native-host-manifest.exe
      to: native-host-manifest.exe
    - from: ../extension/extension_id_source.txt
      to: extension_id_source.txt
    - from: resources/icon.png
      to: icon.png

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  # Registers the native messaging host; see build/installer.nsh.
  include: build/installer.nsh
